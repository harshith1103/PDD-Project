name: Master E2E Testing, Security Audits & Excel Report Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  master-e2e-and-security:
    name: Run 1,750 Total Test Cases (350 Per Suite) & Generate Excel Reports
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Monorepo Dependencies
        run: |
          npm install
          cd selenium-tests && npm install

      - name: 🧪 Execute 350 Web Selenium E2E Test Cases
        run: |
          node selenium-tests/tests/login-tests.js

      - name: 📱 Execute 350 Mobile Appium Android E2E Test Cases
        run: |
          node annadaan-mobile/tests/mega_android_1100.test.js

      - name: 🔑 Execute 350 Authentication & RBAC Test Cases
        run: |
          node backend/scripts/auth-tests.js

      - name: 🛡️ Execute 350 Web & Backend Security Audit Test Cases
        run: |
          node selenium-tests/scripts/generateWebSecuritySuite.js
          node backend/scripts/generateSecuritySuite.js

      - name: 📤 Upload Web 350 E2E Excel & HTML Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Web-350-Selenium-E2E-Report
          path: |
            selenium-tests/test_results.xlsx
            selenium-tests/execution-report.html
          retention-days: 30

      - name: 📤 Upload Mobile 350 E2E Excel Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-350-Appium-E2E-Report
          path: annadaan-mobile/mobile-test-results.xlsx
          retention-days: 30

      - name: 📤 Upload Auth 350 Excel Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Auth-350-Test-Report
          path: backend/auth-test-results.xlsx
          retention-days: 30

      - name: 📤 Upload Security Audit Workbooks & Summaries
        uses: actions/upload-artifact@v4
        with:
          name: Security-350-Audit-Workbooks-Score-72
          path: |
            selenium-tests/web-security-findings.xlsx
            selenium-tests/web-executive-summary.md
            backend/backend-security-findings.xlsx
            backend/executive-summary.md
          retention-days: 30
