name: Selenium E2E Tests & Excel Report Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selenium-test-execution:
    name: Run 300 E2E Selenium Tests & Generate Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: |
          npm install
          cd selenium-tests && npm install

      - name: 🧪 Execute 300 Selenium Test Cases & Generate Excel Report
        run: |
          cd selenium-tests && node tests/login-tests.js

      - name: 📤 Upload Excel Report as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-300-Test-Cases-Report
          path: selenium-tests/test_results.xlsx
          retention-days: 30
