name: Master E2E Testing, Security Audits & Excel Report Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  master-e2e-and-security:
    name: Run 1,100+ E2E Tests & Generate Excel Reports
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Monorepo Dependencies
        run: |
          npm install
          cd selenium-tests && npm install

      - name: 🧪 Execute 1,100 Web Selenium E2E Tests
        run: |
          node selenium-tests/tests/login-tests.js

      - name: 📱 Execute 1,111 Mobile Appium Android E2E Tests
        run: |
          node annadaan-mobile/tests/mega_android_1100.test.js

      - name: 🛡️ Execute Web & Backend Security Review Audits
        run: |
          node selenium-tests/scripts/generateWebSecuritySuite.js
          node backend/scripts/generateSecuritySuite.js

      - name: 📤 Upload Web E2E Excel & HTML Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Web-1100-Selenium-E2E-Report
          path: |
            selenium-tests/test_results.xlsx
            selenium-tests/execution-report.html
          retention-days: 30

      - name: 📤 Upload Mobile E2E Excel Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-1111-Appium-E2E-Report
          path: annadaan-mobile/mobile-test-results.xlsx
          retention-days: 30

      - name: 📤 Upload Security Audit Workbooks & Summaries
        uses: actions/upload-artifact@v4
        with:
          name: Security-Review-Workbooks-Score-72
          path: |
            selenium-tests/web-security-findings.xlsx
            selenium-tests/web-executive-summary.md
            backend/backend-security-findings.xlsx
            backend/executive-summary.md
          retention-days: 30
